; Which Python interpreter Webots launches this controller with.
;
; WHY THIS FILE EXISTS
; --------------------
; Webots defaults to `python3`. On this machine that resolves to an interpreter
; with no NumPy, and the failure is silent-but-severe: the controller catches the
; ImportError, logs it once at info level, and carries on with
;
;   * model-based CoM balance      OFF  (main/libraries/balance.py never loads)
;   * the CoM single-support gate  OFF  (lower_body falls back to a blanket
;                                        ungated_lift_cap, so a foot lift is
;                                        capped rather than verified)
;   * gait Tier B stance gate      permanently False
;
; i.e. the project's central technical contribution does not run, and the only
; visible symptom is a robot whose legs never lean. Measured over 84,831 logged
; control frames: the left and right hip roll were exact mirrors in 100.00% of
; them, which is only possible if the balance loop contributed nothing at all.
;
; Setting it here rather than in Tools > Preferences > Python command means the
; fix lives in the repository, travels with the project, and cannot be lost when
; a preferences file is rewritten.
;
; ON ANOTHER MACHINE: change the one path below to that machine's `py312`
; interpreter (`conda run -n py312 which python` will print it). If the path does
; not exist Webots falls back to `python3` and the controller will print a
; DEGRADED block at startup telling you so.

[python]
COMMAND = /home/CSPM26/miniconda3/envs/py312/bin/python
